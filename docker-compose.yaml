services:
  mongodb:
    image: mongo:7
    container_name: mongo-db-container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - task-manager-net

  backend:
    build: ./backend
    container_name: task-backend-container
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo-db-container:27017/devops-task-manager
      - FRONTEND_URL=http://192.168.56.101:5173
    networks:
      - task-manager-net
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://192.168.56.101:5000/api
    container_name: task-frontend
    ports:
      - "5173:80"
    networks:
      - task-manager-net
    depends_on:
      - backend

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express-container
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo-db-container
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_PASSWORD}
    networks:
      - task-manager-net
    depends_on:
      - mongodb

networks:
  task-manager-net:

volumes:
  mongo-data:
